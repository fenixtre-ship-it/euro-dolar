name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q EuroDolar.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
        working-directory: EuroDolar
      - run: gh release create v${{ github.run_number }} EuroDolar/app/build/outputs/apk/debug/app-debug.apk --title "App v${{ github.run_number }}" --notes "APK de prueba"
        env:
          GH_TOKEN: ${{ github.token }}
